version: 2
updates:
  # npm: raíz y workspaces (server, client) comparten el lockfile de la raíz
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # TypeScript 7 no expone la API programática que necesita `nest build`
    # (vuelve en 7.1): no subir de major hasta que el CLI de Nest lo soporte.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Imagen base del Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
